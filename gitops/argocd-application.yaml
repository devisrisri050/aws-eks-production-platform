apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eks-devops-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/devisrisri050/aws-eks-production-platform.git
    targetRevision: master
    path: gitops/prod/devops-app

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
