apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-devops-app
  namespace: devops-app
  labels:
    app: eks-devops-app

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: eks-devops-app

  template:
    metadata:
      labels:
        app: eks-devops-app

    spec:
      containers:
        - name: eks-devops-app
          image: 866705901512.dkr.ecr.ap-south-1.amazonaws.com/eks-devops-app:c85786a2e36979af9dbd7963ac26e328e6a1964e
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080
              protocol: TCP

          env:
            - name: ENVIRONMENT
              value: "prod"

            - name: APP_VERSION
              value: "0d66c5226b206e26d29dc308a46ba9e7e7e1e491"

            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: eks-devops-app-secret
                  key: APP_SECRET

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"