name: CI - Build, Scan and Push

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "866705901512"
  ECR_REPOSITORY: eks-devops-app
  ECR_REGISTRY: 866705901512.dkr.ecr.ap-south-1.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::866705901512:role/GitHubActionsEKSDevOpsRole
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-ci
          allowed-account-ids: 866705901512

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            ./app

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image to ECR
        run: |
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

      - name: Update GitOps image
        run: |
          sed -i "s|^\(\s*image:\s*866705901512\.dkr\.ecr\.ap-south-1\.amazonaws\.com/eks-devops-app:\).*|\1${IMAGE_TAG}|" gitops/prod/devops-app/deployment.yaml
          sed -i "0,/value: \"1.0.0\"/s//value: \"${IMAGE_TAG}\"/" gitops/prod/devops-app/deployment.yaml

      - name: Commit GitOps change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/prod/devops-app/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Update GitOps image to ${IMAGE_TAG}"
          git push
